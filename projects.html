<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects — Michelle Jiang</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ingrid+Darling&family=Hubballi&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Projects — mobile base ── */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .projects-main {
            flex: 1;
            padding: 1.25rem 1.25rem 3rem;
        }

        .page-heading {
            font-family: var(--font-body);
            font-size: 1.75rem;
            color: #000;
            margin-bottom: 1.25rem;
        }

        .projects-area {
            position: relative;
        }

        .squiggle { display: none; }

        .projects-panel {
            background: var(--surface);
            border-radius: 1.5rem;
            padding: 2rem 1.25rem;
            position: relative;
        }

        .char-fluffy,
        .char-star { display: none; }

        /* ── Projects grid ── */
        /* To add a new project: copy one .project-card block inside .projects-grid */
        .projects-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
        }

        .project-card {
            background: var(--surface-2);
            border-radius: 0.625rem;
            aspect-ratio: 445 / 230;
        }

        /* ── Tablet (768px+) ── */
        @media (min-width: 768px) {
            .projects-main { padding: 1.5rem 1.75rem 3rem; }
            .page-heading { font-size: 2rem; }

            .squiggle {
                display: block;
                position: absolute;
                right: 0;
                top: -1rem;
                width: 52%;
                pointer-events: none;
                opacity: 0.8;
            }

            .projects-panel {
                border-radius: 2rem;
                padding: 2.5rem 2rem;
            }

            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem 2.5rem;
            }
        }

        /* ── Desktop (1024px+) ── */
        @media (min-width: 1024px) {
            .projects-main { padding: 1.5rem 2.5rem 4rem; }
            .page-heading { font-size: 2.25rem; }

            .projects-panel {
                border-radius: 5.49vw;
                padding: 5.69vw 7.92vw;
            }

            .projects-grid { gap: 4vw 11.5vw; }
            .project-card { border-radius: 0.7vw; }

            .char-fluffy {
                display: flex;
                align-items: center;
                justify-content: center;
                position: absolute;
                top: -2rem;
                left: -2rem;
                width: 5.5rem;
                pointer-events: none;
            }

            .char-fluffy img {
                width: 80%;
                transform: rotate(9.65deg);
            }

            .char-star {
                display: flex;
                align-items: center;
                justify-content: center;
                position: absolute;
                bottom: -2rem;
                right: -2rem;
                width: 5.5rem;
                pointer-events: none;
            }

            .char-star img {
                width: 80%;
                transform: rotate(9.65deg);
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="nav-brand">
            <a href="index.html"><img class="logo-img" src="assets/logo.svg" alt="logo"></a>
            <a class="site-name" href="index.html">michelle jiang</a>
        </div>
        <nav>
            <a href="about.html">about</a>
            <a href="projects.html" class="active">projects</a>
            <a href="experience.html">experience</a>
        </nav>
    </header>

    <main class="projects-main">
        <h1 class="page-heading">project gallery</h1>

        <div class="projects-area">
            <img class="squiggle" src="assets/lineArt-home.svg" alt="">

            <div class="projects-panel">

                <div class="char-fluffy">
                    <img src="assets/oneLittleBlob.svg" alt="">
                </div>

                <div class="char-star">
                    <img src="assets/oneLittleStar.svg" alt="">
                </div>

                <!-- =============================================
                     PROJECT GRID
                     To add a new project, copy a .project-card
                     block below and paste it inside this div.
                     ============================================= -->
                <div class="projects-grid">

                    <div class="project-card">
                        <!-- Project content goes here -->
                    </div>

                </div>
            </div>
        </div>
    </main>
</body>
</html>
