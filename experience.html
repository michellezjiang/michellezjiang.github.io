<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience — Michelle Jiang</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ingrid+Darling&family=Hubballi&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Experience — mobile base ── */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .experience-main {
            flex: 1;
            padding: 1.25rem 1.25rem 3rem;
        }

        .page-heading {
            font-family: var(--font-body);
            font-size: 1.75rem;
            color: #000;
            margin-bottom: 1.5rem;
        }

        .experience-area {
            position: relative;
        }

        .timeline-spine,
        .char-fluffy,
        .char-star { display: none; }

        /* ── Timeline ── */
        /* To add a new entry: copy a .timeline-entry block,
           toggle class between "left" and "right", fill in content */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .timeline-entry { width: 100%; }

        .entry-card {
            background: var(--surface);
            border-radius: 0.875rem;
            padding: 1rem 1.125rem;
        }

        .entry-role,
        .entry-org,
        .entry-date {
            font-family: var(--font-body);
            font-size: 1rem;
            color: #000;
        }

        .entry-date { margin-bottom: 0.625rem; }

        .entry-bullets {
            font-family: var(--font-body);
            font-size: 1rem;
            color: #000;
            margin-left: 1.25rem;
        }

        /* ── Tablet (768px+) ── */
        @media (min-width: 768px) {
            .experience-main { padding: 1.5rem 2rem 3rem; }
            .page-heading { font-size: 2rem; }

            .entry-role,
            .entry-org,
            .entry-date,
            .entry-bullets { font-size: 1.0625rem; }

            .entry-card {
                border-radius: 1rem;
                padding: 1.25rem 1.5rem;
            }
        }

        /* ── Desktop (1024px+) — alternating timeline layout ── */
        @media (min-width: 1024px) {
            .experience-main { padding: 6.5vw 2.5rem 4rem; }
            .page-heading { font-size: 2.25rem; }

            /* Vertical squiggle spine through the centre */
            .timeline-spine {
                display: block;
                position: absolute;
                left: calc(50% - 9.165vw);
                top: 0;
                width: 18.33vw;
                height: 66.74vw;
                overflow: hidden;
                pointer-events: none;
                z-index: 1;
            }

            .timeline-spine img {
                position: absolute;
                width: 66.74vw;
                height: 18.33vw;
                max-width: none;
                transform: rotate(90deg);
                left: -24.205vw;
                top: 24.205vw;
            }

            /* Decorative characters */
            .char-fluffy {
                display: flex;
                align-items: center;
                justify-content: center;
                position: absolute;
                left: 1.88vw;
                top: 14vw;
                width: 5.5rem;
                pointer-events: none;
                z-index: 3;
            }

            .char-fluffy img {
                width: 80%;
                transform: rotate(9.65deg);
            }

            .char-star {
                display: flex;
                align-items: center;
                justify-content: center;
                position: absolute;
                right: 0;
                top: 35vw;
                width: 5.5rem;
                pointer-events: none;
                z-index: 3;
            }

            .char-star img {
                width: 80%;
                transform: rotate(9.65deg);
            }

            /* Timeline alternating layout */
            .timeline {
                gap: 3vw;
                position: relative;
                z-index: 2;
            }

            .timeline-entry {
                width: 27vw;
                min-height: 21.88vw;
                position: relative;
            }

            .timeline-entry.left {
                align-self: flex-start;
                margin-left: 11.81vw;
            }

            .timeline-entry.right {
                align-self: flex-end;
                margin-right: 6.53vw;
            }

            /* Connector lines to the centre spine */
            .timeline-entry.left::after {
                content: '';
                position: absolute;
                top: 4.5vw;
                right: -16vw;
                width: 16vw;
                height: 1px;
                background: #aaa;
                z-index: 0;
            }

            .timeline-entry.right::before {
                content: '';
                position: absolute;
                top: 4.24vw;
                left: -16vw;
                width: 16vw;
                height: 1px;
                background: #aaa;
                z-index: 0;
            }

            .entry-card {
                border-radius: 1.6vw;
                padding: 1.67vw 1.39vw;
                min-height: 21.88vw;
                position: relative;
                z-index: 2;
            }

            .entry-role,
            .entry-org,
            .entry-date,
            .entry-bullets { font-size: 1.125rem; }

            .entry-date { margin-bottom: 1.5vw; }
            .entry-bullets { margin-left: 1.5vw; }
        }
    </style>
</head>
<body>
    <div class="nav-row">
        <a href="index.html"><img class="logo-img" src="assets/logo.svg" alt="logo"></a>
        <a class="site-name" href="index.html">michelle jiang</a>
    </div>
    <nav>
        <a href="about.html">about</a>
        <a href="projects.html">projects</a>
        <a href="experience.html" class="active">experience</a>
    </nav>

    <main class="experience-main">
        <h1 class="page-heading">experience</h1>

        <div class="experience-area">

            <!-- Decorative vertical squiggle spine (desktop only) -->
            <div class="timeline-spine">
                <img src="assets/lineArt-home.svg" alt="">
            </div>

            <div class="char-fluffy">
                <img src="assets/oneLittleBlob.svg" alt="">
            </div>

            <div class="char-star">
                <img src="assets/oneLittleStar.svg" alt="">
            </div>

            <!-- =====================================================
                 TIMELINE ENTRIES
                 To add a new entry:
                   • Copy a .timeline-entry block
                   • Toggle class between "left" and "right"
                   • Update role, org, date, and bullet points
                 ===================================================== -->
            <div class="timeline">

                <div class="timeline-entry left">
                    <div class="entry-card">
                        <p class="entry-role">Enterprise Technology Intern</p>
                        <p class="entry-org">@ State Farm</p>
                        <p class="entry-date">May 2026 - Aug 2026</p>
                        <ul class="entry-bullets">
                            <li>data engineering and aggregation</li>
                        </ul>
                    </div>
                </div>

                <div class="timeline-entry right">
                    <div class="entry-card">
                        <p class="entry-role">Effective Coding with AI TA</p>
                        <p class="entry-org">@ CMU School of Computer Science</p>
                        <p class="entry-date">January 2026 - present</p>
                        <ul class="entry-bullets">
                            <li>ta duties ts</li>
                        </ul>
                    </div>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
