<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michelle Jiang</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ingrid+Darling&family=Hubballi&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: white;
            overflow: hidden;
        }

        /* Scale all values from a 1440px design width using vw units (px / 14.4) */
        .page {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* On desktop the nav-row children are absolute, so this wrapper is invisible */
        .nav-row {
            display: contents;
        }

        /* Logo star image: left 17px, top 19px, 72x53px */
        .logo-img {
            position: absolute;
            left: 1.18vw;
            top: 1.32vw;
            width: 5vw;
            height: 3.68vw;
            object-fit: contain;
        }

        /* "michelle jiang": left 83px, top 36px, 36px font */
        .site-name {
            position: absolute;
            left: 5.76vw;
            top: 2.5vw;
            font-family: 'Hubballi', sans-serif;
            font-size: 2.15vw;
            color: black;
            white-space: nowrap;
            text-decoration: none;
        }

        /* Nav links: top 36px, 36px font */
        nav {
            position: absolute;
            right: 1.32vw;
            top: 2.5vw;
            display: flex;
            gap: 2.5vw;
        }

        nav a {
            font-family: 'Hubballi', sans-serif;
            font-size: 2.15vw;
            color: black;
            text-decoration: none;
            white-space: nowrap;
        }

        nav a:hover {
            opacity: 0.6;
        }

        /* "Welcome!": left 90px, top 310px, 256px font */
        .welcome {
            position: absolute;
            left: 6.25vw;
            top: 19.5vw;
            font-family: 'Ingrid Darling', sans-serif;
            font-size: 17.78vw;
            color: black;
            line-height: 1;
        }

        /* "this is michelle's portfolio.": left 140px, top 586px, 64px font */
        .tagline {
            position: absolute;
            left: 9.72vw;
            top: 36vw;
            font-family: 'Hubballi', sans-serif;
            font-size: 3vw;
            color: black;
            white-space: nowrap;
        }

        /* Characters image: bottom-right, moved up to fit within viewport */
        .characters {
            position: absolute;
            left: 76.74vw;
            top: 43vw;
            width: 20.55vw;
            height: 13.52vw;
            object-fit: contain;
            transform: rotate(9.65deg);
        }

        /* ── Tablet (768px – 1024px) ── */
        @media (max-width: 1024px) {
            .logo-img {
                width: 40px;
                height: 30px;
                left: 16px;
                top: 14px;
            }

            .site-name {
                left: 64px;
                top: 18px;
                font-size: 20px;
            }

            nav {
                right: 16px;
                top: 18px;
                gap: 20px;
            }

            nav a {
                font-size: 20px;
            }

            .welcome {
                left: 5vw;
                top: 18vw;
                font-size: 18vw;
            }

            .tagline {
                left: 7vw;
                top: 36vw;
                font-size: 3.5vw;
            }

            .characters {
                left: 68vw;
                top: 44vw;
                width: 28vw;
                height: 18vw;
            }
        }

        /* ── Mobile (<768px) ── */
        @media (max-width: 767px) {
            body {
                overflow: auto;
                height: auto;
            }

            .page {
                position: static;
                height: auto;
                min-height: 100vh;
                width: 100%;
                display: flex;
                flex-direction: column;
                padding: 14px 20px 40px;
            }

            /* nav-row: logo + site name side by side */
            .nav-row {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 8px;
            }

            .logo-img {
                position: static;
                width: 36px;
                height: 26px;
                flex-shrink: 0;
            }

            .site-name {
                position: static;
                font-size: 18px;
            }

            /* Nav links row below logo */
            nav {
                position: static;
                gap: 20px;
                justify-content: flex-start;
                margin-bottom: 4px;
            }

            nav a {
                font-size: 16px;
            }

            /* Main content stacked */
            .welcome {
                position: static;
                font-size: 21vw;
                line-height: 1;
                margin-top: 20px;
            }

            .tagline {
                position: static;
                font-size: 5.5vw;
                white-space: normal;
                margin-top: 10px;
            }

            /* Hide characters — they'd overflow and overlap text */
            .characters {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="nav-row">
            <a href="#"><img class="logo-img" src="assets/logo.png" alt="logo"></a>
            <a class="site-name" href="#">michelle jiang</a>
        </div>
        <nav>
            <a href="about.html">about</a>
            <a href="projects.html">projects</a>
            <a href="experience.html">experience</a>
        </nav>
        <p class="welcome">Welcome!</p>
        <p class="tagline">this is michelle&#8217;s portfolio.</p>
        <img class="characters" src="assets/twoLittleGuys.png" alt="characters">
    </div>
</body>
</html>
