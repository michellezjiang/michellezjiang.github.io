<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michelle Jiang</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ingrid+Darling&family=Hubballi&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Home — mobile base ── */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .home-main {
            flex: 1;
            padding: 1.25rem 1.25rem 2.5rem;
            display: flex;
            flex-direction: column;
        }

        .welcome {
            font-family: var(--font-display);
            font-size: clamp(3rem, 21vw, 18rem);
            line-height: 1;
            margin-top: 1rem;
        }

        .tagline {
            font-family: var(--font-body);
            font-size: clamp(1rem, 5.5vw, 1.5rem);
            margin-top: 0.5rem;
        }

        .line-art,
        .characters { display: none; }

        /* ── Desktop (1024px+) — artistic single-screen layout ── */
        @media (min-width: 1024px) {
            body {
                overflow: hidden;
                height: 100vh;
            }

            .home-main {
                position: relative;
                padding: 0;
                overflow: hidden;
            }

            .welcome {
                position: absolute;
                left: 6.25vw;
                top: 14vw;
                font-size: 17.78vw;
                margin-top: 0;
            }

            .tagline {
                position: absolute;
                left: 9.72vw;
                top: 31vw;
                font-size: 3vw;
                margin-top: 0;
                white-space: nowrap;
            }

            .line-art {
                display: block;
                position: absolute;
                right: 0;
                top: 16vw;
                width: 52vw;
            }

            .characters {
                display: block;
                position: absolute;
                right: 3.26vw;
                bottom: 4vw;
                width: 20.55vw;
                height: auto;
                transform: rotate(9.65deg);
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="nav-brand">
            <a href="#"><img class="logo-img" src="assets/logo.svg" alt="logo"></a>
            <a class="site-name" href="#">michelle jiang</a>
        </div>
        <nav>
            <a href="about.html">about</a>
            <a href="projects.html">projects</a>
            <a href="experience.html">experience</a>
        </nav>
    </header>
    <main class="home-main">
        <p class="welcome">Welcome!</p>
        <p class="tagline">this is michelle&#8217;s portfolio.</p>
        <img class="line-art" src="assets/lineArt-home.svg" alt="">
        <img class="characters" src="assets/twoLittleGuys.svg" alt="">
    </main>
</body>
</html>
